name: Publish to pub.dev

on:
  push:
    tags:
      # Configure the same pattern on pub.dev as v{{version}}.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # Required for pub.dev authentication via OIDC.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
